name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode bundle
        run: |
          cd ios
          SCHEME=$(xcodebuild -list -workspace *.xcworkspace | awk '/Schemes:/{flag=1; next} flag && NF{print $1; exit}')
          xcodebuild -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_PROVISIONING_PROFILE=""

      - name: Package into IPA archive
        run: |
          mkdir Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r AnythingLLM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnythingLLM-IPA
          path: AnythingLLM.ipa
