name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show versions
        run: |
          node -v
          xcodebuild -version

      - name: Install dependencies
        run: yarn install

      - name: Env file
        run: cp .env.example .env || true

      - name: Add stand-in font and dummy Firebase plist
        run: |
          mkdir -p src/assets/fonts
          cp node_modules/react-native-vector-icons/Fonts/MaterialIcons.ttf src/assets/fonts/ClashDisplay-Medium.ttf
          KEY="AI""zaSy$(printf 'A%.0s' $(seq 1 33))"
          cat > ios/GoogleService-Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>$KEY</string>
            <key>GCM_SENDER_ID</key><string>123456789012</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>ai.AnythingLLM</string>
            <key>PROJECT_ID</key><string>anythingllm-local</string>
            <key>STORAGE_BUCKET</key><string>anythingllm-local.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><false/>
            <key>IS_SIGNIN_ENABLED</key><false/>
            <key>GOOGLE_APP_ID</key><string>1:123456789012:ios:0123456789abcdef0123</string>
          </dict>
          </plist>
          PLIST
          ls -la src/assets/fonts ios/GoogleService-Info.plist

      - name: Exclude duplicate react-native-fs on iOS
        run: |
          python3 - <<'PY'
          p = 'react-native.config.js'
          s = open(p).read()
          head = 'module.exports = {\n'
          assert head in s, 'config anchor missing'
          s = s.replace(head, head + "  dependencies: {\n    'react-native-fs': { platforms: { ios: null } },\n  },\n", 1)
          open(p, 'w').write(s)
          PY
          cat react-native.config.js

      - name: Patch iOS project
        run: |
          cd ios
          sed -i '' "s/\(RCT_NEW_ARCH_ENABLED'\] = \)'0'/\1'1'/" Podfile
          python3 - <<'PY'
          p = 'Podfile'
          s = open(p).read()
          anchor = "  pod 'simdjson', path: '../node_modules/@nozbe/simdjson', modular_headers: true\n"
          assert anchor in s, 'podfile anchor missing'
          mods = ['GoogleUtilities', 'FirebaseCore', 'FirebaseCoreExtension', 'FirebaseInstallations', 'GoogleDataTransport', 'nanopb']
          extra = ''.join("  pod '%s', :modular_headers => true\n" % m for m in mods)
          open(p, 'w').write(s.replace(anchor, anchor + extra))

          a = 'AnythingLLM/AppDelegate.mm'
          s = open(a).read()
          imp = '#import "AppDelegate.h"\n'
          mod = '  self.moduleName = @"AnythingLLM";'
          assert imp in s and mod in s, 'appdelegate anchors missing'
          s = s.replace(imp, imp + '#import <ReactAppDependencyProvider/RCTAppDependencyProvider.h>\n', 1)
          s = s.replace(mod, '  self.dependencyProvider = [RCTAppDependencyProvider new];\n' + mod, 1)
          open(a, 'w').write(s)
          PY
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.1;/" AnythingLLM.xcodeproj/project.pbxproj
          grep -n "NEW_ARCH\|modular_headers" Podfile
          rm -f Podfile.lock

      - name: Install CocoaPods
        run: |
          cd ios
          RCT_NEW_ARCH_ENABLED=1 pod install
          echo "--- RNFS pods linked (RNFS should be absent, ReactNativeFs present) ---"
          grep -n "RNFS\|ReactNativeFs" Podfile.lock | head

      - name: Build Unsigned Archive
        run: |
          set -o pipefail
          mkdir -p build
          cd ios
          RCT_NEW_ARCH_ENABLED=1 xcodebuild -workspace AnythingLLM.xcworkspace \
            -scheme AnythingLLM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive -archivePath ../build/AnythingLLM.xcarchive 2>&1 | tee ../build/xcodebuild.log

      - name: Show build errors
        if: failure()
        run: |
          L=build/xcodebuild.log
          echo "===== linker details ====="
          n=$(grep -n "linker command failed" $L | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n>120?n-120:1)),${n}p" $L | grep -v "Disabling previews" | cut -c1-300 | tail -n 70; fi
          echo "===== undefined / duplicate / missing ====="
          grep -nE "Undefined symbols|duplicate symbol|library not found|framework not found|ld: " -A6 $L | grep -v "Disabling previews" | cut -c1-300 | head -n 60 || true
          echo "===== error lines ====="
          grep -nE "error:|ARCHIVE FAILED" $L | cut -c1-300 | head -n 20 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AnythingLLM.xcarchive/Products/Applications/AnythingLLM.app build/Payload/
          cd build
          zip -r AnythingLLM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnythingLLM-unsigned-ipa
          path: build/AnythingLLM.ipa
