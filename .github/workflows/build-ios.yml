name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Install CocoaPods
        run: |
          cd ios
          RCT_NEW_ARCH_ENABLED=1 pod install

      - name: Build Unsigned Archive
        run: |
          cd ios
          RCT_NEW_ARCH_ENABLED=1 xcodebuild -workspace AnythingLLM.xcworkspace \
            -scheme AnythingLLM \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive -archivePath ../build/AnythingLLM.xcarchive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AnythingLLM.xcarchive/Products/Applications/AnythingLLM.app build/Payload/
          cd build
          zip -r AnythingLLM.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnythingLLM-unsigned-ipa
          path: build/AnythingLLM.ipa
